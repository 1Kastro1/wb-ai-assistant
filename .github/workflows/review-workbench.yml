name: Review workbench regression

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/workflows/review-workbench.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/review-workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: wb_workbench_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_runner -d wb_workbench_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:////tmp/wb-workbench-ci.db
      WB_DATA_DIR: /tmp/wb-workbench-ci-data
      WB_ENABLE_REAL_PUBLISH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Verify owner examples and safe review workflows
        run: |
          python -m unittest discover -s backend/tests -p 'test_owner_review_cases.py'
          python -m unittest discover -s backend/tests -p 'test_review_workbench.py'
          python -m unittest discover -s backend/tests -p 'test_fitment_catalog.py'
          python -m unittest discover -s backend/tests -p 'test_internet_fitment.py'
          python -m unittest discover -s backend/tests -p 'test_registration_approval.py'
          python -m unittest discover -s backend/tests -p 'test_activity_history.py'
      - name: Verify question VIN display and resync
        run: python -m unittest discover -s backend/tests -p 'test_question_vin.py'
      - name: Verify simultaneous PostgreSQL editing
        env:
          DATABASE_URL: postgresql+psycopg://test_runner:disposable-test-password@127.0.0.1:5432/wb_workbench_tests
          WB_POSTGRES_TEST: '1'
        run: python -m unittest discover -s backend/tests -p 'test_postgres_draft_conflicts.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install -g pnpm@11.19.0 && pnpm install --frozen-lockfile
      - name: Verify frontend recovery and autosave
        working-directory: frontend
        run: node --test tests/*.test.mjs tests/review-card.test.cjs
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
