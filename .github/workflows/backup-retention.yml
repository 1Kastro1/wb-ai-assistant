name: Assistant backup retention
on:
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/backup-retention.yml']
  pull_request:
    paths: ['deploy/**', '.github/workflows/backup-retention.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy/tests -v
      - run: bash -n deploy/backup-vps.sh deploy/update-vps.sh
